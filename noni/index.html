<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Noni</title>
  <style>
    /* === Base Resets === */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Fix for Safari iOS viewport height (address bar issues) */
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
      -webkit-user-select: none;
      user-select: none;
      /* Prevent Safari iOS from adding extra space */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      color: var(--text);
      background: var(--bg);
      box-sizing: border-box;
    }

    * {
      touch-action: pan-x pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    /* === Theme (Dark Mode auto support) === */
    :root {
      --bg: #ffffff;
      --text: #111111;
      --primary: #2563eb;
      --radius: 0.75rem;
      --space: 1.25rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --text: #fafafa;
        --primary: #3b82f6;
      }
    }

    /* === Layout Helpers === */
    .container {
      width: min(90%, 800px);
      margin-inline: auto;
      padding-block: calc(var(--space) * 2);
    }

    /* Main container for full viewport (Safari iOS fix) */
    main.container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      position: relative;
    }

    /* === Typography === */
    h1, h2 {
      line-height: 1.2;
      margin-bottom: var(--space);
    }

    /* === Button === */
    button,
    .button {
      /* Remove all default browser styling */
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;

      /* Reset all spacing */
      margin: 0;
      padding: 0;
      border: none;
      outline: none;

      /* Apply custom styling */
      display: inline-block;
      padding: 0.75rem 1.25rem;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: var(--radius);
      font-weight: 600;
      transition: all 0.2s;
      cursor: pointer;

      /* Prevent text selection and touch highlighting */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      /* Ensure consistent font rendering */
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
    }

    button:hover,
    .button:hover {
      filter: brightness(1.1);
    }

    button:active,
    .button:active {
      filter: brightness(0.9);
    }

    /* Buttons inside .inner scale with --scale */
    [style*="--scale"] button,
    [style*="--scale"] .button {
      margin: 0; /* Explicitly reset margin in scaled contexts */
      padding: calc(var(--scale) * 12px) calc(var(--scale) * 20px);
      border-radius: calc(var(--scale) * 8px);
      font-size: inherit; /* Use parent's scaled font-size */
    }

    /* === Minor polish === */
    section {
      background: rgba(0,0,0,0.05);
      border-radius: var(--radius);
      padding: var(--space);
    }

    @media (prefers-color-scheme: dark) {
      section {
        background: rgba(255,255,255,0.05);
      }
    }
  </style>
</head>

<body>
  <main class="container">
  </main>
  <script src="main.js"></script>
</body>
</html>
