<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock</title>
  <style>
    * { box-sizing: border-box; }
    html {
      scrollbar-width: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      color: #222;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: scroll;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }

    /* menu */
    #menu-grid {
      display: none;
      gap: 12px;
      padding: 24px;
      width: 100%;
      justify-content: center;
      background: #8a9baa;
      min-height: 100vh;
    }
    #menu-grid.active { display: grid; }
    .tile {
      border: 1px solid #aaa;
      padding: 3px;
      background: #ccc;
      cursor: pointer;
      aspect-ratio: 1;
    }
    .tile canvas { display: block; width: 100%; height: 100%; background: #fff; }

    /* sub screen */
    #sub-screen {
      display: none;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      background: #333;
      cursor: pointer;
    }
    #sub-screen.active { display: flex; }
  </style>
</head>
<body>
  <div id="menu-grid"></div>
  <div id="sub-screen"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
