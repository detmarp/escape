<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock</title>
  <style>
    * { box-sizing: border-box; }
    html {
      scrollbar-width: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      color: #222;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: scroll;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }

    #app {
      min-height: 100vh;
    }
    #app.menu {
      display: grid;
      gap: 12px;
      padding: 24px;
      width: 100%;
      justify-content: center;
      background: #8a9baa;
    }
    .tile {
      border: 1px solid #aaa;
      padding: 3px;
      background: #ccc;
      cursor: pointer;
      aspect-ratio: 1;
      line-height: 0;
    }
    .tile canvas { display: block; width: 100%; height: 100%; background: #fff; }
    #app.screen {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #333;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const p = new URLSearchParams(location.search).get('clock')
    document.getElementById('app').style.background = p ? '#333' : '#8a9baa'
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
