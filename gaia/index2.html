<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortest WebLLM Example</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2em auto; }
        #output { white-space: pre-wrap; border: 1px solid #ccc; padding: 1em; margin-top: 1em; min-height: 100px; }
        #status { color: grey; }
    </style>
</head>
<body>
    <h1>WebLLM Minimal Example</h1>
    <p id="status">Loading engine and model...</p>

    <input type="text" id="prompt-input" placeholder="Enter your prompt here" style="width: 80%;">
    <button id="generate-btn" disabled>Generate</button>

    <div id="output"></div>

    <script type="module">
        import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        // Get references to our HTML elements
        const status = document.getElementById("status");
        const promptInput = document.getElementById("prompt-input");
        const generateBtn = document.getElementById("generate-btn");
        const output = document.getElementById("output");

        // Use a small model for faster loading
        //const SELECTED_MODEL = "gemma-2b-it-q4f32_1";
        //const SELECTED_MODEL = "Llama-2-7b-chat-hf-q4f32_1";
        const SELECTED_MODEL = "Llama-3.1-8B-Instruct-q4f32_1-MLC";

        // Instantiate the WebLLM engine
        const engine = await CreateMLCEngine(SELECTED_MODEL, {
            // Provide a callback to track model loading progress
            initProgressCallback: (progress) => {
                status.textContent = `Loading: ${progress.text}`;
            }
        });

        // Update UI when the model is ready
        status.textContent = "Model loaded. Ready to chat.";
        generateBtn.disabled = false;

        // Set up the button click event listener
        generateBtn.addEventListener("click", async () => {
            const prompt = promptInput.value;
            if (!prompt) return;

            generateBtn.disabled = true;
            output.textContent = "";
            let currentResponse = "AI: ";

            // Generate a response using the streaming API
            const chunks = await engine.chat.completions.create({
                stream: true,
                messages: [{ "role": "user", "content": prompt }],
            });

            // Process the stream of response chunks
            for await (const chunk of chunks) {
                const delta = chunk.choices[0]?.delta?.content || "";
                currentResponse += delta;
                output.textContent = currentResponse;
            }

            generateBtn.disabled = false;
        });
    </script>
</body>
</html>
