<!doctype html>
<html lang="en">
<head>
    <script>
      // Prevent iOS pinch/double-tap zoom
      ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu'].forEach(function(type) {
        document.addEventListener(type, function(e) {
          e.preventDefault();
        }, { passive: false });
      });
    </script>
  <meta charset="utf-8">
  <title>Paxi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="A minimal modern web app boilerplate.">
  <link rel="stylesheet" href="mystyle.css">

  <link rel="preload" href="mystyle.css" as="style">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <script type="module" src="main.js"></script>
</body>
</html>
